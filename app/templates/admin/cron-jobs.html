{% extends 'admin/base.html' %}

{% block title %} HMD Hermada - Cron Jobs {% endblock %}

{% block head %}
<!-- Style the Bootstrap pagination arrow anchor links with a gray color. -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome (for eye icons) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
th.sortable {
  cursor: pointer;
  position: relative;
  user-select: none;
}
th.sortable::after {
  content: '';
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  border: 6px solid transparent;
  border-top-color: #ccc;
  border-bottom-color: #ccc;
}
th.sortable.asc::after {
  border-bottom-color: transparent;
  border-top-color: #000;
}
th.sortable.desc::after {
  border-top-color: transparent;
  border-bottom-color: #000;
}

/* Wrapper para sa input at icon */
.password-wrapper {
  position: relative;
}

/* Eye icon positioning */
.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%); /* Sentro sa vertical */
  cursor: pointer;
  color: #6c757d;
  z-index: 10; /* Siguradong nasa ibabaw ng input */
}

.toggle-password:hover {
  color: #000;
}

/* Iwasang matakpan ng icon ang text na tinatype */
.form-control.password-input {
  padding-right: 40px;
}

/* Alert Notification */
.user-alert {
  padding: 10px 15px;
  border-radius: 6px;
  margin-bottom: 15px;
  font-size: 14px;
  display: none;
}

.user-success {
  background-color: #d1e7dd;
  color: #0f5132;
}

.user-error {
  background-color: #f8d7da;
  color: #842029;
}

/* Idagdag ito sa loob ng <style> tag mo */
#userTable td.d-flex {
    height: 100%;
    min-height: 45px; /* Adjust base sa normal height ng rows mo */
    border-bottom: 0; /* Iwas sa double border sa loob */
}

/* Edit User Accounts Button */
/* Modal footer base */
.modal-footer {
    display: flex;
    gap: 6px;
}

/* Modal footer Mobile view */
@media (max-width: 768px) {

  .modal-footer {
      flex-direction: row;
      flex-wrap: nowrap;          /* one row only */
      justify-content: space-between;
      align-items: center;
  }

  .modal-footer .btn {
      flex: 1 1 auto;             /* pantay lapad */
      width: auto;
      padding: 6px 8px;           /* mas compact */
      font-size: 13px;            /* kasya sa mobile */
      white-space: nowrap;        /* hindi mag wrap text */
  }
}

</style>

{% endblock %}

{% block content %}

<main>
    <div class="container-fluid px-4">
        <h1 class="mt-4">Cron Jobs</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="index.html">Dashboard</a></li>
            <li class="breadcrumb-item active">Cron Jobs</li>
        </ol>

        <hr>
        
        <div class="container">
        
          <div class="card mb-4">
            <div class="card-header">
                &nbsp;
            </div>
            <div class="card-body">
              <div class="card-body text-center py-5">
                  <p class="text-muted mb-0">
                      This page is currently under construction. Please check back soon.
                  </p>
              </div>

            </div>
          </div>

        </div>
    </div>
</main>
<br>

{% endblock %}
